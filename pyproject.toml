[project]
name = "hydra_skypilot_launcher"
version = "0.1.0"
description = "Hydra launcher to launch multirun jobs as SkyPilot jobs."
readme = "README.md"
authors = [{ name = "Carel van Niekerk", email = "vniekerk.carel@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["hydra-core>=1.3.0", "skypilot-nightly[slurm,gcp]"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
